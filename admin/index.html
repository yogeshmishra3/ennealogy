<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #5f9ea0, #4682b4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-fluid {
            background-color: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        .container-fluid h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
        }

        .container-fluid input[type="text"],
        .container-fluid input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f9f9;
            transition: 0.3s;
        }

        .container-fluid input[type="text"]:focus,
        .container-fluid input[type="password"]:focus {
            outline: none;
            border-color: #4682b4;
            background-color: #fff;
        }

        .container-fluid button {
            width: 100%;
            padding: 12px;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .container-fluid button:hover {
            background-color: #5f9ea0;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 80%;
        }

        .modal-content h2 {
            font-size: 24px;
            color: #333;
        }

        .modal-content button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-content button:hover {
            background-color: #5f9ea0;
        }

        /* Responsive design */
        @media (max-width: 400px) {
            .container-fluid {
                width: 90%;
                padding: 20px;
            }

            .container-fluid h1 {
                font-size: 20px;
            }

            .container-fluid input[type="text"],
            .container-fluid input[type="password"] {
                font-size: 14px;
            }

            .container-fluid button {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
    <script>
        function login() {
            const AdminId = document.getElementById("AdminId").value;
            const password = document.getElementById("password").value;

            // Simple validation - replace with real authentication in production
            if (AdminId === "aaa" && password === "aaa") {
                // Show the success modal
                document.getElementById("login-success-modal").style.display = "flex";
            } else {
                // Show error message if credentials are incorrect
                document.getElementById("error-message").style.display = "block";
            }
        }

        function closeModal() {
            // Hide the modal and redirect to the main page
            document.getElementById("login-success-modal").style.display = "none";
            localStorage.setItem("loggedIn", "true");
            window.location.href = "live.html";
        }
    </script>
</head>
<body>
    <div class="container-fluid">
        <h1>Admin Login</h1>
        <input type="text" id="AdminId" placeholder="Enter username"><br>
        <input type="password" id="password" placeholder="Enter password"><br>
        <button onclick="login()">Login</button>
        <p id="error-message" class="error-message">Invalid Username/Password</p>
    </div>

    <!-- Modal for successful login -->
    <div id="login-success-modal" class="modal">
        <div class="modal-content">
            <h2>Login Successful!</h2>
            <button onclick="closeModal()">Proceed to Dashboard</button>
        </div>
    </div>
</body>
</html>
