<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(89, 149, 170);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-fluid{
            background-color: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
        }

        .container-fluid h1{
            font-size: 24px;
            color: rgb(40, 39, 39);
            margin-bottom: 25px;
        }

        .container-fluid input[type="text"],
        .container-fluid input[type="password"]{
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid rgb(213, 204, 204);
            border-radius: 8px;
            font-size: 16px;
            background-color: rgb(255, 255, 255);
            transition: 0.3s;
        }

        .container-fluid input[type="text"]:focus,
        .container-fluid input[type="password"]:focus{
            outline: none;
            border-color: rgb(76, 197, 76);
            background-color: white;
        }

        .container-fluid button{
            width: 100%;
            padding: 12px;
            background-color: rgb(114, 198, 114);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .container-fluid button:hover{
            background-color: rgb(33, 215, 33);
            border: none;
        }

        .error-message{
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .modal{
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 80%;
            height: 15%;
        }

        .modal-content h2{
            font-size: 24px;
            color: #333;
        }

        .modal-content button{
            margin-top: 20px;
            padding: 10px 20px;
            background-color: rgb(129, 215, 129);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .modal-content button:hover{
            background-color: rgb(91, 217, 91);
        }


    </style>
    <script>
        function login(){
            const AdminId = document.getElementById("AdminId").value;
            const password = document.getElementById("password").value;

            if(AdminId === "aaa" && password === "aaa"){
                document.getElementById("login-success-modal").style.display = "flex";
            }else{
                document.getElementById("error-message").style.display = "block";
            }
        }

        function closeModal(){
            document.getElementById("login-success-modal").style.display = "none";
            localStorage.setItem("loggedIn", "true");
            window.location.href = "DemoIndex.html";
        }
    </script>
</head>
<body>
    <div class="container-fluid">
        <h1>Admin, Please login here!</h1>
        <label for="username"></label>
        <input type="text" id="AdminId" placeholder="Enter Username"><br>
        <label for="password"></label>
        <input type="password"  id="password" placeholder="Enter Password"><br>
        <button onclick="login()">Login</button>
        <p id="error-message" class="error-message">Invalid Username/Password</p>
    </div>

    <div id="login-success-modal" class="modal">
        <div class="modal-content">
            <h2>Login Successful!</h2>
            <button onclick="closeModal()">Proceed to Dashboard</button>
        </div>
    </div>
</body>
</html>
